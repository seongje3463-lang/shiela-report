<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiela — Daily Report | 초코렌트카</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e4e2db;
    --text: #1a1a18;
    --text-sub: #6b6b65;
    --text-dim: #a8a8a0;
    --accent: #2d6a4f;
    --accent-light: #e8f4ee;
    --accent-btn: #2d6a4f;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --warn: #d4821a;
    --warn-light: #fef6e8;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title { font-size: 15px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent; cursor: pointer;
    color: var(--text-sub); transition: all 0.15s;
  }
  .lang-btn.active {
    background: var(--text); color: #fff; border-color: var(--text);
  }

  /* LAYOUT */
  .container { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }

  /* DATE NAV */
  .date-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-bottom: 24px;
  }
  .date-nav-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text-sub); transition: all 0.15s;
  }
  .date-nav-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
  .date-display { font-size: 16px; font-weight: 600; font-family: 'DM Mono', monospace; }

  /* SYNC STATUS */
  .sync-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 20px;
    font-size: 12px; font-weight: 500;
    background: var(--accent-light); color: var(--accent);
    border: 1px solid #c3e6d0;
  }
  .sync-bar.error { background: var(--danger-light); color: var(--danger); border-color: #f0c8c4; }
  .sync-bar.saving { background: var(--warn-light); color: var(--warn); border-color: #f5ddb0; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .sync-dot.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 16px;
  }

  /* ATTENDANCE */
  .att-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .att-box {
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
  }
  .att-box-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
  .att-time {
    font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500;
    margin-bottom: 12px; color: var(--text);
    min-height: 32px;
  }
  .att-time.empty { color: var(--text-dim); }
  .att-btn {
    width: 100%; padding: 9px 0; border-radius: 7px;
    border: none; cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; transition: all 0.15s;
  }
  .att-btn.checkin { background: var(--accent); color: #fff; }
  .att-btn.checkin:hover { background: #255c43; }
  .att-btn.checkout { background: var(--danger); color: #fff; }
  .att-btn.checkout:hover { background: #a93226; }
  .att-btn.done { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* TASKS */
  .task-input-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .task-input {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); font-family: 'DM Sans', sans-serif;
    font-size: 14px; outline: none; background: var(--bg);
    transition: border 0.15s;
  }
  .task-input:focus { border-color: var(--accent); background: #fff; }
  .add-btn {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  .add-btn:hover { background: #255c43; }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    transition: border-color 0.15s;
  }
  .task-item.done-item { border-color: var(--accent-light); }
  .task-main {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  }
  .task-num {
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--text-dim); min-width: 18px;
  }
  .task-text { flex: 1; font-size: 14px; line-height: 1.4; }
  .task-text.done-text {
    text-decoration: line-through; color: var(--text-dim);
  }
  .complete-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 500; cursor: pointer; color: var(--text-sub);
    transition: all 0.15s; white-space: nowrap;
  }
  .complete-btn:hover { border-color: var(--accent); color: var(--accent); }
  .complete-btn.done-btn {
    background: var(--accent-light); color: var(--accent);
    border-color: var(--accent-light); cursor: default;
  }
  .task-memo {
    padding: 0 14px 12px 42px;
  }
  .task-memo-input {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); font-family: 'DM Sans', sans-serif;
    font-size: 13px; color: var(--text-sub); background: var(--bg);
    outline: none; resize: none;
  }
  .task-memo-input:focus { border-color: var(--accent); background: #fff; }
  .no-tasks { font-size: 14px; color: var(--text-dim); text-align: center; padding: 20px 0; }

  /* EXPENSE */
  .exp-input-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 14px; align-items: center;
  }
  .exp-input-row .exp-select { width: 120px; flex-shrink: 0; }
  .exp-input-row .exp-name-input { flex: 1; min-width: 120px; }
  .exp-input-row .exp-amt-input { width: 90px; flex-shrink: 0; }
  .exp-select, .exp-input {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    background: var(--bg); outline: none; transition: border 0.15s;
  }
  .exp-select:focus, .exp-input:focus { border-color: var(--accent); background: #fff; }
  .exp-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .exp-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px; background: var(--bg);
    font-size: 13px;
  }
  .exp-cat {
    font-size: 11px; font-weight: 500; padding: 2px 8px;
    border-radius: 20px; background: var(--accent-light); color: var(--accent);
    white-space: nowrap;
  }
  .exp-name { flex: 1; }
  .exp-amount { font-family: 'DM Mono', monospace; font-weight: 500; }
  .exp-del {
    background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 16px; line-height: 1;
    padding: 2px 4px; border-radius: 4px; transition: color 0.15s;
  }
  .exp-del:hover { color: var(--danger); }
  .exp-total {
    display: flex; justify-content: flex-end;
    font-size: 13px; font-weight: 600; padding-top: 8px;
    border-top: 1px solid var(--border); color: var(--accent);
  }
  .no-exp { font-size: 14px; color: var(--text-dim); text-align: center; padding: 16px 0; }

  /* CHART TABS */
  .chart-tab {
    width:44px; font-family:'DM Sans',sans-serif; font-size:11px; font-weight:500;
    padding:5px 0; border-radius:6px; border:1px solid var(--border);
    background:transparent; color:var(--text-sub); cursor:pointer; transition:all 0.15s;
    text-align:center;
  }
  .chart-tab.active { background:var(--text); color:#fff; border-color:var(--text); }

  /* NOTE */
  .note-area {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid var(--border); font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.6; background: var(--bg);
    min-height: 90px; resize: vertical; outline: none;
    transition: border 0.15s;
  }
  .note-area:focus { border-color: var(--accent); background: #fff; }
  .save-btn {
    width: 100%; margin-top: 12px; padding: 12px;
    border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .save-btn:hover { background: #255c43; }
  .save-btn:disabled { background: var(--text-dim); cursor: not-allowed; }

  /* READONLY overlay for past dates */
  .readonly-notice {
    background: var(--warn-light); color: var(--warn);
    border: 1px solid #f5ddb0; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title" id="h-title">실라 — 업무 보고</div>
    <div class="header-sub">초코렌트카 Daily Work Log</div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn active" onclick="setLang('ko')">한국어</button>
  </div>
</div>

<div class="container">

  <!-- DATE NAV -->
  <div class="date-nav">
    <button class="date-nav-btn" onclick="changeDate(-1)">&#8592;</button>
    <div class="date-display" id="date-display"></div>
    <button class="date-nav-btn" onclick="changeDate(1)">&#8594;</button>
  </div>

  <!-- SYNC STATUS -->
  <div class="sync-bar" id="sync-bar" style="justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-msg">구글 시트와 동기화됨</span>
    </div>
    <button onclick="loadData()" style="background:none;border:none;cursor:pointer;font-size:15px;color:currentColor;padding:0 2px;" title="Refresh">↻</button>
  </div>

  <!-- READONLY NOTICE -->
  <div class="readonly-notice" id="readonly-notice">
    📅 <span id="readonly-text">This is a past record. Changes cannot be saved.</span>
  </div>

  <!-- ATTENDANCE -->
  <div class="card">
    <div class="card-label" id="l-att">출퇴근 기록</div>
    <div class="att-grid">
      <div class="att-box">
        <div class="att-box-label" id="l-checkin">출근 시간</div>
        <div class="att-time" id="checkin-display">—</div>
        <button class="att-btn checkin" id="btn-checkin" onclick="recordCheckin()">
          <span id="l-btn-checkin">출근 기록</span>
        </button>
      </div>
      <div class="att-box">
        <div class="att-box-label" id="l-checkout">퇴근 시간</div>
        <div class="att-time" id="checkout-display">—</div>
        <button class="att-btn checkout" id="btn-checkout" onclick="recordCheckout()">
          <span id="l-btn-checkout">퇴근 기록</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TASKS -->
  <div class="card">
    <div class="card-label" id="l-tasks">오늘의 업무</div>
    <div class="task-input-row" id="task-input-area">
      <input class="task-input" id="task-input" type="text" placeholder="업무 내용 입력..." onkeydown="if(event.key==='Enter')addTask()">
      <button class="add-btn" onclick="addTask()" id="l-add">+ 추가</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>

  <!-- EXPENSE -->
  <div class="card">
    <div class="card-label" id="l-expense">지출 내역</div>
    <!-- 입력 폼 한 줄 -->
    <div class="exp-input-row" id="exp-input-area">
      <select class="exp-select" id="exp-cat">
        <option value="traffic" id="o-traffic">교통</option>
        <option value="office" id="o-office">사무</option>
        <option value="food" id="o-food">식비</option>
        <option value="other" id="o-other">기타</option>
      </select>
      <input class="exp-input exp-name-input" id="exp-name" type="text" placeholder="항목명">
      <input class="exp-input exp-amt-input" id="exp-amount" type="number" placeholder="AED" min="0">
      <button class="add-btn" onclick="addExpense()">+ Add</button>
    </div>
    <!-- 리스트 -->
    <div class="exp-list" id="exp-list"></div>
    <div class="exp-total" id="exp-total" style="display:none"></div>
    <!-- 도넛 차트 — 리스트 아래 가로 배치 -->
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:24px;">
      <div>
        <div style="display:flex;gap:4px;margin-bottom:10px;">
          <button class="chart-tab active" onclick="setChartTab('today',this)" id="tab-today">오늘</button>
          <button class="chart-tab" onclick="setChartTab('week',this)" id="tab-week">주간</button>
          <button class="chart-tab" onclick="setChartTab('month',this)" id="tab-month">월간</button>
        </div>
        <svg id="donut-svg" width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="45" fill="none" stroke="#e4e2db" stroke-width="18"/>
          <text x="60" y="56" text-anchor="middle" font-size="9" fill="#a8a8a0" id="donut-label">합계</text>
          <text x="60" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a18" id="donut-total">0</text>
        </svg>
      </div>
      <div id="donut-legend" style="display:flex;flex-direction:column;gap:6px;"></div>
    </div>
  </div>

  <!-- NOTE -->
  <div class="card">
    <div class="card-label" id="l-note">특이사항</div>
    <textarea class="note-area" id="note-area" placeholder="오늘의 특이사항을 입력하세요..."></textarea>
    <button class="save-btn" id="save-btn" onclick="saveAll()">
      <span id="l-save">저장</span>
    </button>
  </div>

</div>

<script>
// =============================================
// CONFIGURATION — Apps Script URL 입력
// =============================================
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGtOwzKsKvMYgxFgEtMJFTHXgj9ZJWiSFDgdXZKfMdAtgQN81x7COHizPCDq4StBNT/exec';

// =============================================
// STATE
// =============================================
var currentDate = getTodayStr();
var isToday = true;
var lang = 'ko';
var data = {
  checkin: '', checkout: '',
  tasks: [], expenses: [], note: ''
};

var TX = {
  en: {
    title: 'Shiela — Daily Report',
    att: 'ATTENDANCE', checkin: 'Check-in time', checkout: 'Check-out time',
    btn_in: 'Clock In', btn_out: 'Clock Out',
    already_in: 'Already recorded', already_out: 'Already recorded',
    tasks: "TODAY'S WORK", task_ph: 'Add a task...', add: '+ Add',
    done: 'Complete', pending: 'Pending',
    memo_ph: 'Reason / note...',
    expense: 'EXPENSE DETAILS', item: 'Item name', aed: 'AED',
    cat: { traffic: 'Traffic', office: 'Office', food: 'Food', other: 'Other' },
    total: 'Total',
    note: 'SPECIAL NOTES', note_ph: 'Any special notes for today...',
    save: 'Save',
    no_tasks: 'No tasks registered.',
    no_exp: 'No expense records.',
    tab_today: 'Today', tab_week: 'Week', tab_month: 'Month',
    sync_ok: 'Synced with Google Sheets',
    sync_saving: 'Saving...',
    sync_err: 'Connection error. Check Apps Script URL.',
    sync_loading: 'Loading data...',
    readonly: 'This is a past record. Changes cannot be saved.',
  },
  ko: {
    title: '실라 — 업무 보고',
    att: '출퇴근 기록', checkin: '출근 시간', checkout: '퇴근 시간',
    btn_in: '출근 기록', btn_out: '퇴근 기록',
    already_in: '이미 기록됨', already_out: '이미 기록됨',
    tasks: '오늘의 업무', task_ph: '업무 내용 입력...', add: '+ 추가',
    done: '완료', pending: '진행중',
    memo_ph: '사유 / 메모...',
    expense: '지출 내역', item: '항목명', aed: 'AED',
    cat: { traffic: '교통', office: '사무', food: '식비', other: '기타' },
    total: '합계',
    note: '특이사항', note_ph: '오늘의 특이사항을 입력하세요...',
    save: '저장',
    no_tasks: '등록된 업무가 없습니다.',
    no_exp: '지출 내역이 없습니다.',
    tab_today: '오늘', tab_week: '주간', tab_month: '월간',
    sync_ok: '구글 시트와 동기화됨',
    sync_saving: '저장 중...',
    sync_err: '연결 오류. Apps Script URL을 확인하세요.',
    sync_loading: '데이터 불러오는 중...',
    readonly: '과거 날짜입니다. 수정 후 저장이 불가합니다.',
  }
};

function T(k) { return TX[lang][k] || k; }

// =============================================
// DATE HELPERS
// =============================================
function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function formatDisplayDate(str) {
  var d = new Date(str + 'T00:00:00');
  if (lang === 'ko') {
    var days_ko = ['일','월','화','수','목','금','토'];
    return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days_ko[d.getDay()] + ')';
  } else {
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' (' + days[d.getDay()] + ')';
  }
}

function changeDate(delta) {
  var d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  var newStr = d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
  var today = getTodayStr();
  if (newStr > today) return; // 미래 이동 불가
  currentDate = newStr;
  isToday = (currentDate === today);
  loadData();
}

// =============================================
// SYNC / API
// =============================================
function setSyncStatus(state, msg) {
  var bar = document.getElementById('sync-bar');
  var dot = document.getElementById('sync-dot');
  var msgEl = document.getElementById('sync-msg');
  bar.className = 'sync-bar' + (state === 'error' ? ' error' : state === 'saving' ? ' saving' : '');
  dot.className = 'sync-dot' + (state === 'saving' ? ' pulse' : '');
  msgEl.textContent = msg || T('sync_' + state);
}

function loadData() {
  document.getElementById('date-display').textContent = formatDisplayDate(currentDate);
  setSyncStatus('saving', T('sync_loading'));

  // 읽기 전용 처리
  var rn = document.getElementById('readonly-notice');
  if (!isToday) {
    rn.style.display = 'block';
    document.getElementById('readonly-text').textContent = T('readonly');
    document.getElementById('save-btn').disabled = true;
  } else {
    rn.style.display = 'none';
    document.getElementById('save-btn').disabled = false;
  }

  var url = APPS_SCRIPT_URL + '?action=read&date=' + currentDate + '&_=' + Date.now();
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(res) {
      if (res.status === 'ok') {
        if (res.record) {
          data.checkin = res.record.checkin || '';
          data.checkout = res.record.checkout || '';
          data.tasks = res.record.tasks || [];
          data.expenses = res.record.expenses || [];
          data.note = res.record.note || '';
        } else {
          data = { checkin:'', checkout:'', tasks:[], expenses:[], note:'' };
        }
        setSyncStatus('ok');
        render();
      } else {
        setSyncStatus('error');
      }
    })
    .catch(function() {
      setSyncStatus('error');
      // 오류여도 빈 상태로 렌더
      data = { checkin:'', checkout:'', tasks:[], expenses:[], note:'' };
      render();
    });
}

function saveAll() {
  if (!isToday) return;
  data.note = document.getElementById('note-area').value;
  setSyncStatus('saving');

  var params = '?action=write' +
    '&date=' + encodeURIComponent(currentDate) +
    '&checkin=' + encodeURIComponent(data.checkin || '') +
    '&checkout=' + encodeURIComponent(data.checkout || '') +
    '&tasks=' + encodeURIComponent(JSON.stringify(data.tasks || [])) +
    '&expenses=' + encodeURIComponent(JSON.stringify(data.expenses || [])) +
    '&note=' + encodeURIComponent(data.note || '') +
    '&_=' + Date.now();

  fetch(APPS_SCRIPT_URL + params)
  .then(function(r){ return r.json(); })
  .then(function(res) {
    if (res.status === 'ok') {
      setSyncStatus('ok');
    } else {
      setSyncStatus('error');
    }
  })
  .catch(function() { setSyncStatus('error'); });
}

// =============================================
// ATTENDANCE
// =============================================
function recordCheckin() {
  if (data.checkin || !isToday) return;
  var now = new Date();
  data.checkin = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  renderAttendance();
  saveAll();
}

function recordCheckout() {
  if (data.checkout || !isToday) return;
  var now = new Date();
  data.checkout = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  renderAttendance();
  saveAll();
}

function renderAttendance() {
  var ci = document.getElementById('checkin-display');
  var co = document.getElementById('checkout-display');
  var bi = document.getElementById('btn-checkin');
  var bo = document.getElementById('btn-checkout');

  if (data.checkin) {
    ci.textContent = data.checkin;
    ci.className = 'att-time';
    bi.innerHTML = '<span id="l-btn-checkin">' + T('already_in') + '</span>';
    bi.className = 'att-btn done';
    bi.disabled = true;
  } else {
    ci.textContent = '—';
    ci.className = 'att-time empty';
    bi.innerHTML = '<span id="l-btn-checkin">' + T('btn_in') + '</span>';
    bi.className = 'att-btn checkin';
    bi.disabled = !isToday;
  }

  if (data.checkout) {
    co.textContent = data.checkout;
    co.className = 'att-time';
    bo.innerHTML = '<span id="l-btn-checkout">' + T('already_out') + '</span>';
    bo.className = 'att-btn done';
    bo.disabled = true;
  } else {
    co.textContent = '—';
    co.className = 'att-time empty';
    bo.innerHTML = '<span id="l-btn-checkout">' + T('btn_out') + '</span>';
    bo.className = 'att-btn checkout';
    bo.disabled = !isToday;
  }
}

// =============================================
// TRANSLATE
// =============================================
function translateText(text, targetLang, callback) {
  var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(res) {
      var translated = '';
      if (res && res[0]) {
        res[0].forEach(function(item) { if(item[0]) translated += item[0]; });
      }
      callback(translated || text);
    })
    .catch(function() { callback(text); });
}

function translateTasks(tasks, targetLang, callback) {
  if (tasks.length === 0) { callback([]); return; }
  var translated = tasks.slice();
  var pending = tasks.length;
  tasks.forEach(function(t, i) {
    translateText(t.text, targetLang, function(result) {
      translated[i] = Object.assign({}, t, { displayText: result });
      pending--;
      if (pending === 0) callback(translated);
    });
  });
}

// =============================================
// TASKS
// =============================================
function addTask() {
  if (!isToday) return;
  var inp = document.getElementById('task-input');
  var txt = inp.value.trim();
  if (!txt) return;
  data.tasks.push({ text: txt, done: false, memo: '' });
  inp.value = '';
  renderTasks();
  saveAll();
}

function completeTask(i) {
  if (!isToday) return;
  data.tasks[i].done = true;
  renderTasks();
  saveAll();
}

function updateMemo(i, val) {
  data.tasks[i].memo = val;
}

function renderTasks() {
  var list = document.getElementById('task-list');
  if (data.tasks.length === 0) {
    list.innerHTML = '<div class="no-tasks">' + T('no_tasks') + '</div>';
    return;
  }
  list.innerHTML = data.tasks.map(function(t, i) {
    var isDone = t.done;
    var displayText = t.displayText || t.text;
    return '<div class="task-item' + (isDone ? ' done-item' : '') + '">' +
      '<div class="task-main">' +
        '<span class="task-num">' + (i+1) + '.</span>' +
        '<span class="task-text' + (isDone ? ' done-text' : '') + '">' + escHtml(displayText) + '</span>' +
        (isDone
          ? '<span class="complete-btn done-btn">' + T('done') + '</span>'
          : (isToday ? '<button class="complete-btn" onclick="completeTask('+i+')">' + T('done') + '</button>' : '<span class="complete-btn done-btn">' + T('pending') + '</span>')
        ) +
      '</div>' +
      (!isDone ? '<div class="task-memo"><textarea class="task-memo-input" rows="1" placeholder="' + T('memo_ph') + '" onchange="updateMemo('+i+',this.value)" onblur="updateMemo('+i+',this.value);if(isToday)saveAll()">' + escHtml(t.memo||'') + '</textarea></div>' : '') +
    '</div>';
  }).join('');
}

// =============================================
// EXPENSES
// =============================================
function addExpense() {
  if (!isToday) return;
  var cat = document.getElementById('exp-cat').value;
  var name = document.getElementById('exp-name').value.trim();
  var amt = parseFloat(document.getElementById('exp-amount').value);
  if (!name || isNaN(amt) || amt <= 0) return;
  data.expenses.push({ cat: cat, name: name, amount: amt });
  document.getElementById('exp-name').value = '';
  document.getElementById('exp-amount').value = '';
  renderExpenses();
  renderDonut();
  saveAll();
}

function deleteExpense(i) {
  if (!isToday) return;
  data.expenses.splice(i, 1);
  renderExpenses();
  saveAll();
}

function renderExpenses() {
  var list = document.getElementById('exp-list');
  var total = document.getElementById('exp-total');

  if (data.expenses.length === 0) {
    list.innerHTML = '<div class="no-exp">' + T('no_exp') + '</div>';
    total.style.display = 'none';
    return;
  }

  var sum = 0;
  list.innerHTML = data.expenses.map(function(e, i) {
    sum += e.amount;
    return '<div class="exp-row">' +
      '<span class="exp-cat">' + (T('cat')[e.cat] || e.cat) + '</span>' +
      '<span class="exp-name">' + escHtml(e.name) + '</span>' +
      '<span class="exp-amount">AED ' + e.amount.toFixed(2) + '</span>' +
      (isToday ? '<button class="exp-del" onclick="deleteExpense('+i+')" title="Delete">×</button>' : '') +
    '</div>';
  }).join('');

  total.style.display = 'flex';
  total.textContent = T('total') + ': AED ' + sum.toFixed(2);
}

// =============================================
// RENDER ALL
// =============================================
function render() {
  renderAttendance();
  renderTasks();
  renderExpenses();
  document.getElementById('note-area').value = data.note || '';
  applyLang();
  renderDonut();
}

function applyLang() {
  document.getElementById('h-title').textContent = T('title');
  document.getElementById('l-att').textContent = T('att');
  document.getElementById('l-checkin').textContent = T('checkin');
  document.getElementById('l-checkout').textContent = T('checkout');
  var lbi = document.getElementById('l-btn-checkin');
  var lbo = document.getElementById('l-btn-checkout');
  if(lbi) lbi.textContent = T('btn_in');
  if(lbo) lbo.textContent = T('btn_out');
  document.getElementById('l-tasks').textContent = T('tasks');
  document.getElementById('task-input').placeholder = T('task_ph');
  document.getElementById('l-add').textContent = T('add');
  document.getElementById('l-expense').textContent = T('expense');
  document.getElementById('exp-name').placeholder = T('item');
  document.getElementById('l-note').textContent = T('note');
  document.getElementById('note-area').placeholder = T('note_ph');
  document.getElementById('l-save').textContent = T('save');
  document.getElementById('date-display').textContent = formatDisplayDate(currentDate);
  document.getElementById('o-traffic').textContent = T('cat').traffic;
  document.getElementById('o-office').textContent = T('cat').office;
  document.getElementById('o-food').textContent = T('cat').food;
  document.getElementById('o-other').textContent = T('cat').other;
  // sync msg
  var bar = document.getElementById('sync-bar');
  if (!bar.classList.contains('error') && !bar.classList.contains('saving')) {
    document.getElementById('sync-msg').textContent = T('sync_ok');
  }
  if (document.getElementById('readonly-notice').style.display !== 'none') {
    document.getElementById('readonly-text').textContent = T('readonly');
  }
  // re-render all sections for translated strings
  updateTabLabels();
  renderDonut();
  renderAttendance();
  renderTasks();
  renderExpenses();
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent === (l === 'en' ? 'EN' : '한국어'));
  });
  // 업무 내용 번역
  var targetLang = l === 'ko' ? 'ko' : 'en';
  translateTasks(data.tasks, targetLang, function(translatedTasks) {
    data.tasks = translatedTasks;
    applyLang();
  });
}

// =============================================
// DONUT CHART
// =============================================
var chartTab = 'today';

function setChartTab(tab, btn) {
  chartTab = tab;
  document.querySelectorAll('.chart-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  updateTabLabels();
  renderDonut();
}

function updateTabLabels() {
  var t = [T('tab_today'), T('tab_week'), T('tab_month')];
  var td = document.getElementById('tab-today');
  var tw = document.getElementById('tab-week');
  var tm = document.getElementById('tab-month');
  if(td) td.textContent = t[0];
  if(tw) tw.textContent = t[1];
  if(tm) tm.textContent = t[2];
}

function renderDonut() {
  var expenses = [];
  if (chartTab === 'today') {
    expenses = data.expenses || [];
  } else {
    // 주간/월간은 오늘 데이터만 표시 (향후 확장 가능)
    expenses = data.expenses || [];
  }

  var cats = { traffic: 0, office: 0, food: 0, other: 0 };
  expenses.forEach(function(e){ cats[e.cat] = (cats[e.cat]||0) + e.amount; });
  var total = Object.values(cats).reduce(function(a,b){ return a+b; }, 0);

  var colors = { traffic: '#f59e0b', office: '#3b82f6', food: '#ec4899', other: '#8b5cf6' };
  var svg = document.getElementById('donut-svg');
  var legend = document.getElementById('donut-legend');
  var dtotal = document.getElementById('donut-total');
  var dlabel = document.getElementById('donut-label');
  if (!svg || !legend) return;

  // 기존 arc 제거
  var oldArcs = svg.querySelectorAll('.arc');
  oldArcs.forEach(function(a){ a.remove(); });

  dtotal.textContent = total > 0 ? Math.round(total) : '0';
  dlabel.textContent = T('total');

  var r = 45, cx = 60, cy = 60, circ = 2 * Math.PI * r;
  var offset = 0;
  var legendHtml = '';

  if (total === 0) {
    // 빈 상태
    legend.innerHTML = '<div style="font-size:11px;color:var(--text-dim);text-align:center;">' + T('no_exp') + '</div>';
    return;
  }

  Object.keys(cats).forEach(function(cat) {
    var val = cats[cat];
    if (val <= 0) return;
    var pct = val / total;
    var dash = pct * circ;
    var circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('class','arc');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', r);
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke', colors[cat]);
    circle.setAttribute('stroke-width','18');
    circle.setAttribute('stroke-dasharray', dash + ' ' + (circ - dash));
    circle.setAttribute('stroke-dashoffset', String(-(offset * circ)));
    circle.setAttribute('transform','rotate(-90 60 60)');
    svg.insertBefore(circle, svg.querySelector('text'));
    offset += pct;

    var catName = T('cat')[cat] || cat;
    legendHtml += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-sub);">' +
      '<span style="width:7px;height:7px;border-radius:50%;background:' + colors[cat] + ';flex-shrink:0;"></span>' +
      catName + ' ' + Math.round(pct*100) + '%</div>';
  });

  legend.innerHTML = legendHtml;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// INIT
// =============================================
applyLang();
loadData();
</script>
